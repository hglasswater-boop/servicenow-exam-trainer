name: Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Android version
        shell: bash
        run: |
          APP_VERSION=$(node -e "const p=require('./package.json'); process.stdout.write(p.version)")
          VERSION_CODE=$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number); process.stdout.write(String(a*10000+b*100+c))")
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          echo "Android version: ${APP_VERSION} (${VERSION_CODE})"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: servicenow-exam-trainer-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.jks

      - name: Sign release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          VERSION=$(node -e "const p=require('./package.json'); process.stdout.write(p.version)")
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/servicenow-exam-trainer-v${VERSION}.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks android/release.jks             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD"             --key-pass "pass:$ANDROID_KEY_PASSWORD"             --out "$SIGNED"             "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          rm -f android/release.jks "$ALIGNED"

      - name: Upload signed APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: servicenow-exam-trainer-android-release
          path: android/app/build/outputs/apk/release/servicenow-exam-trainer-v*.apk
